server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para React Router: si el archivo no existe, sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de API al backend (cuando se usa Docker Compose)
    location ~ ^/(auth|places|photos|letters|search|map|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Timeout generoso para upload de fotos
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }

    # Caché para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
